{% extends "base.html" %}
{% block content %}
<div class="login-container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px; padding: 2rem; border-radius: 12px; background-color: #ffffff; border: 1px solid #e5e7eb;">
        
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h2 style="font-size: 1.75rem; font-weight: 600; color: #111827; margin-bottom: 0.5rem;">Sign in</h2>
            <p style="font-size: 0.875rem; color: #6b7280;">Access your NGO-cmis dashboard</p>
        </div>

        <form method="post" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"> 
            
            <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                <label for="username" style="font-size: 0.875rem; font-weight: 500; color: #374151;">Username</label>
                <input id="username" name="username" autofocus required style="padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;">
            </div> 

            <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                <label for="password" style="font-size: 0.875rem; font-weight: 500; color: #374151;">Password</label>
                <input id="password" name="password" type="password" required style="padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;">
            </div> 

            <button type="submit" style="margin-top: 0.5rem; padding: 0.75rem; background-color: #0f766e; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 500; cursor: pointer; transition: background-color 0.2s;">
                Sign in
            </button>
        </form>

    </div>
</div>
{% endblock %}
