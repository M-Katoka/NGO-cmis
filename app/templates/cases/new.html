{% extends "base.html" %}
{% block title %}New Case - NGO-cmis{% endblock %}

{% block content %}
<div style="max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem;">
    
    <!-- Page Header -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1 style="font-size: 1.875rem; font-weight: 700; color: #111827; margin-bottom: 0.25rem;">Create New Case</h1>
            <p style="font-size: 0.95rem; color: #6b7280;">Fill out the beneficiary and intake details below.</p>
        </div>
        <a href="{{ url_for('cases.index') }}" style="color: #4b5563; text-decoration: none; font-size: 0.875rem; font-weight: 500;">
            ← Back to Cases
        </a>
    </div>

    <!-- Form Container Card -->
    <div style="background: #ffffff; padding: 2.5rem; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);">
        
        <form method="post" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <!-- CSRF Token if using Flask-WTF -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <!-- Beneficiary Name -->
                <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                    <label for="beneficiary_name" style="font-size: 0.875rem; font-weight: 500; color: #374151;">Beneficiary Name</label>
                    <input type="text" id="beneficiary_name" name="beneficiary_name" placeholder="Full legal name" required style="padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;">
                </div>

                <!-- Case Category -->
                <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                    <label for="category" style="font-size: 0.875rem; font-weight: 500; color: #374151;">Category</label>
                    <select id="category" name="category" required style="padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; background-color: #fff; outline: none;">
                        <option value="" disabled selected>Select category</option>
                        <option value="community_support">Community Support</option>
                        <option value="education">Education & Training</option>
                        <option value="health">Healthcare Assistance</option>
                        <option value="livelihood">Livelihood & Economic</option>
                    </select>
                </div>
            </div>

            <!-- Contact / Location Information -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                    <label for="contact" style="font-size: 0.875rem; font-weight: 500; color: #374151;">Contact Number</label>
                    <input type="text" id="contact" name="contact" placeholder="+260..." style="padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; outline: none;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                    <label for="status" style="font-size: 0.875rem; font-weight: 500; color: #374151;">Initial Status</label>
                    <select id="status" name="status" style="padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; background-color: #fff; outline: none;">
                        <option value="active">Active</option>
                        <option value="pending">Pending Review</option>
                        <option value="closed">Closed</option>
                    </select>
                </div>
            </div>

            <!-- Case Description / Notes -->
            <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                <label for="notes" style="font-size: 0.875rem; font-weight: 500; color: #374151;">Case Notes / Details</label>
                <textarea id="notes" name="notes" rows="4" placeholder="Enter initial observations, assistance needed, or background details..." style="padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; outline: none; font-family: inherit; resize: vertical;"></textarea>
            </div>

            <!-- Form Action Buttons -->
            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem; border-top: 1px solid #f3f4f6; padding-top: 1.5rem;">
                <a href="{{ url_for('cases.index') }}" style="padding: 0.75rem 1.25rem; background-color: #f3f4f6; color: #374151; border-radius: 6px; text-decoration: none; font-size: 0.95rem; font-weight: 500;">
                    Cancel
                </a>
                <button type="submit" style="padding: 0.75rem 1.5rem; background-color: #0f766e; color: white; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); transition: background-color 0.2s;">
                    Save Case Record
                </button>
            </div>

        </form>

    </div>

</div>
{% endblock %}
