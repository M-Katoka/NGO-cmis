{% extends "base.html" %}{% block content %}
<div class="card"><h3>Create user</h3><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input name="full_name" placeholder="Full name" required><input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password (min 8)" required>
<select name="role">{% for r in roles %}<option>{{ r }}</option>{% endfor %}</select><button>Create</button></form></div>
<div class="card"><table><tr><th>User</th><th>Name</th><th>Role</th><th>Active</th><th></th></tr>
{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.full_name }}</td><td>{{ u.role }}</td><td>{{ u.active }}</td>
<td><form method="post" class="inline" action="{{ url_for('admin.toggle_user', user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>{{ 'Deactivate' if u.active else 'Activate' }}</button></form></td></tr>{% endfor %}</table></div>
{% endblock %}
